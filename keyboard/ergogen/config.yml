# ==============================================================================
# DORMIN KEYBOARD - ERGOGEN V4 CONFIGURATION
# 40 — key Split Keyboard
# ==============================================================================

meta:
  name: "Dormin Keyboard"
  author: "William A. Costa"
  version: "1.0.0"
  engine: 4.1.0

# ------------------------------------------------------------------------------
# UNITS
# ------------------------------------------------------------------------------
units:
  # MX standard spacing: 19.05mm (3/4 inch, the Cherry MX spec)
  u: 19.05
  cx: 18
  cy: 18
  sc: 14
  m_pcb: 1.5     # Cost-effective PCB margin (1.5mm beyond 1U pitch)
  m_plate: 2.0   # Top plate margin (2.0mm beyond 1U pitch)
  cnc_gap: 0.4   # CNC machining clearance gap for unibody cavity

# ------------------------------------------------------------------------------
# POINTS
# ------------------------------------------------------------------------------
points:
  key:
    padding: u
    spread: u
    tags:
      - key

  zones:
    matrix:
      columns:
        outer:
          rows.bottom.skip: true
        pinky:
          key:
            stagger: u/2
        ring:
          key:
            stagger: u/4
        middle:
          key:
            stagger: u/4
        index:
          key:
            stagger: -u/4
        inner:
          key:
            stagger: -u/4
      rows:
        bottom:
        home:
        top:

    thumbs:
      anchor:
        ref: matrix_index_bottom
        shift: [-0.1u, -1.30u]
      columns:
        inner:
          key:
            stagger: 0
            splay: 0
        home:
          key:
            stagger: -2.7
            splay: -15
            spread: u+2.5
        outer:
          key:
            stagger: -2.5
            splay: -14
            spread: u+2.5
      rows:
        only:
  mirror:
    ref: matrix_pinky_home
    distance: 230

# ------------------------------------------------------------------------------
# OUTLINES
# ------------------------------------------------------------------------------
outlines:
  _raw_keys:
    - what: rectangle
      where: [key]
      size: [cx, cy]

  _keycaps:
    - what: rectangle
      where: [key]
      size:
        - cx
        - cy
      fillet: 2

  _pcb_bounds:
    - what: rectangle
      where: key
      size: [u + m_pcb * 2, u + m_pcb * 2]
      corner: 2.5

  _plate_bounds:
    - what: rectangle
      where: key
      size: [u + m_plate * 2, u + m_plate * 2]
      corner: 3

  switch_cutouts:
    - what: rectangle
      where: true
      asym: left
      size: sc
      bound: false

  _keypos:
    - what: circle
      where: key
      radius: 1

  # Outline Ref for PCB (Minimal cost-effective margin for manufacturing)
  pcb:
    - what: outline
      name: _pcb_bounds

  # Outline Ref for Top Plate (With MX switch cutouts for CNC aluminum unibody)
  top_plate:
    main:
      what: outline
      name: _plate_bounds
    keyholes:
      what: outline
      name: switch_cutouts
      operation: subtract

  # Outline for Preview (Visualization with rounded keycaps)
  preview:
    - what: outline
      name: _plate_bounds
      operation: stack
    - what: outline
      name: _keycaps
      operation: stack

# ------------------------------------------------------------------------------
# CASES (Sandwich Case)
# ------------------------------------------------------------------------------
cases:
  top_plate_3d:
    - what: outline
      name: top_plate
      extrude: 1.2
  bottom_case_3d:
    - what: outline
      name: _plate_bounds
      extrude: 2.5

# ------------------------------------------------------------------------------
# PCBS
# ------------------------------------------------------------------------------
pcbs:
  dormin:
    outlines:
      - outline: pcb
        layer: Edge.Cuts
    footprints:
      choc_switches:
        what: SW_MX_Choc_Hotswap
        where: true
        params:
          designator: SW
          value: SW_Push
          from: "{{colrow}}_from"
          to: "{{colrow}}_to"
          keycaps: true
