# ==============================================================================
# DORMIN KEYBOARD - ERGOGEN V4 CONFIGURATION
# 40—36 key Split Keyboard
# ==============================================================================

meta:
  name: "Dormin Keyboard"
  author: "William A. Costa"
  version: "1.0.0"
  engine: 4.1.0

# ------------------------------------------------------------------------------
# UNITS
# ------------------------------------------------------------------------------
units:
  # MX standard spacing: 19.05mm (3/4 inch, the Cherry MX spec)
  u: 19.05
  cx: 18
  cy: 18
  sc: 14

# ------------------------------------------------------------------------------
# POINTS
# ------------------------------------------------------------------------------
points:
  key:
    padding: u
    spread: u
    tags:
      - key

  zones:
    matrix:
      anchor:
        rotate: 0
      columns:
        outer:
          rows:
            top:
              skip: true
        pinky:
          key:
            stagger: -u/3
        ring:
          key:
            stagger: u/4
        middle:
          key:
            stagger: u/4
        index:
          key:
            stagger: -u/4
        inner:
          key:
            stagger: -u/4
      rows:
        bottom:
        home:
        top:

    thumbs:
      anchor:
        ref: matrix_index_bottom
        shift: [-5, -1.3u]
      columns:
        t1:
          key:
            stagger: 0
            splay: 0
        t2:
          key:
            stagger: -2.7
            splay: -15
            spread: u+2
        t3:
          key:
            stagger: -1.8
            splay: -10
            spread: u+1.2
        t4:
          key:
            stagger: -1.7
            splay: -10
            spread: u+1.2
      rows:
        only:
  mirror:
    ref: matrix_pinky_home
    distance: 250

# ------------------------------------------------------------------------------
# OUTLINES
# ------------------------------------------------------------------------------
outlines:
  _keycaps:
    - what: rectangle
      where: [key]
      size:
        - cx
        - cy
      fillet: 3

  _raw:
    - what: rectangle
      where: key
      asym: left
      size: [1cx,1cy]

  _switch_cutouts:
    - what: rectangle
      where: true
      asym: left
      size: sc
      bound: false

  _keypos:
    - what: circle
      where: key
      radius: 1

  panel:
    - what: outline
      name: _raw
      expand: 1.6

  switch_plate:
    main:
      what: outline
      name: panel
    keyholes:
      what: outline
      name: _switch_cutouts
      operation: subtract

  pcbref:
    - what: outline
      name: _keypos
      operation: stack
    - what: outline
      name: _raw
      operation: stack

  preview:
    - what: outline
      name: panel
      operation: stack
    - what: outline
      name: _keycaps
      operation: stack
