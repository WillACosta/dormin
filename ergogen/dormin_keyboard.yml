# ==============================================================================
# DORMIN KEYBOARD - ERGOGEN V4 CONFIGURATION
# 40—36 key Split Keyboard
# ==============================================================================

meta:
  name: "Dormin Keyboard"
  author: "William A. Costa"
  version: "1.0.0"
  engine: 4.1.0

# ------------------------------------------------------------------------------
# UNITS
# ------------------------------------------------------------------------------
units:
  # MX standard spacing: 19.05mm (3/4 inch, the Cherry MX spec)
  u: 19.05
  cx: 18
  cy: 18
  sc: 14

# ------------------------------------------------------------------------------
# POINTS
# ------------------------------------------------------------------------------
points:
  key:
    padding: u
    spread: u
    tags:
      - key

  zones:
    matrix:
      anchor:
        rotate: 0
      columns:
        outer:
          rows.top.skip: true
        pinky:
          key:
            stagger: -u/2
        ring:
          key:
            stagger: 4
        middle:
          key:
            stagger: 4
        index:
          key:
            stagger: -4
        inner:
          key:
            stagger: -4
      rows:
        bottom:
        home:
        top:

    thumbs:
      anchor:
        ref: matrix_index_bottom
        shift: [-0.1u, -1.25u]
      columns:
        inner:
          key:
            stagger: 0
            splay: 0
        home:
          key:
            stagger: -2.7
            splay: -15
            spread: u+1.3
        outer:
          key:
            stagger: -2.3
            splay: -13
            spread: u+1.1
        # outermost:
        #   key:
        #     stagger: -2.3
        #     splay: -13
        #     spread: u+1.1
      rows:
        only:
  mirror:
    ref: matrix_pinky_home
    distance: 220

# ------------------------------------------------------------------------------
# OUTLINES
# ------------------------------------------------------------------------------
outlines:
  _keycaps:
    - what: rectangle
      where: [key]
      size:
        - cx
        - cy
      fillet: 3

  _raw:
    - what: rectangle
      where: key
      asym: left
      size: [1cx,1cy]

  switch_cutouts:
    - what: rectangle
      where: true
      asym: left
      size: sc
      bound: false

  _keypos:
    - what: circle
      where: key
      radius: 1

  panel:
    - what: outline
      name: _raw
      expand: 1.6

  switch_plate:
    main:
      what: outline
      name: panel
    keyholes:
      what: outline
      name: switch_cutouts
      operation: subtract

  pcbref:
    - what: outline
      name: _keypos
      operation: stack
    - what: outline
      name: _raw
      operation: stack

  preview:
    - what: outline
      name: panel
      operation: stack
    - what: outline
      name: _keycaps
      operation: stack
